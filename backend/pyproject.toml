[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.109",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "disposable-email-domains>=0.0.278",
    "django>=6.1",
    "django-allauth[socialaccount]>=65.19.7",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.17.2",
    "drf-spectacular>=0.30.0",
    "filetype>=1.2.0",
    "google-auth>=2.61.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentry-sdk[celery,django]>=2.71.0",
    "slack-sdk>=3.45.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff.lint]
# Django and DRF declare mutable class attributes (Meta.ordering, parser_classes, ...) by design.
ignore = ["RUF012"]
