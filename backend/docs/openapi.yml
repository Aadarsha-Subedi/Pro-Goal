openapi: 3.0.3
info:
  title: Project Management API
  version: 1.0.0
  description: Session-cookie API. Call GET /api/csrf/ first, then send the csrftoken
    cookie value as X-CSRFToken on every unsafe request. Every response uses the envelope
    {success, status_code, message, data, meta}; errors carry a stable `code`.
