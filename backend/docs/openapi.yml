components:
  schemas:
    Approve:
      type: object
      description: Optional starting permissions when approving a join request.
      properties:
        permissions:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 100
        preset:
          type: string
          maxLength: 32
    AvatarUpload:
      type: object
      description: Rejects request bodies that carry fields the serializer does not
        declare.
      properties:
        file:
          type: string
          format: uri
      required:
      - file
    CategoryEnum:
      enum:
      - todo
      - in_progress
      - done
      type: string
      description: |-
        * `todo` - To do
        * `in_progress` - In progress
        * `done` - Done
    Comment:
      type: object
      description: Rejects request bodies that carry fields the serializer does not
        declare.
      properties:
        body:
          type: string
          maxLength: 10000
      required:
      - body
    EmailChange:
      type: object
      description: 'Proof of identity for sensitive actions: password, or a fresh
        Google token.'
      properties:
        password:
          type: string
          nullable: true
          maxLength: 128
        id_token:
          type: string
          nullable: true
          maxLength: 4096
        new_email:
          type: string
          maxLength: 254
      required:
      - new_email
    EmailChangeConfirm:
      type: object
      description: Rejects request bodies that carry fields the serializer does not
        declare.
      properties:
        token:
          type: string
          maxLength: 512
      required:
      - token
    EmailOnly:
      type: object
      description: Rejects request bodies that carry fields the serializer does not
        declare.
      properties:
        email:
          type: string
          maxLength: 254
      required:
      - email
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        status_code:
          type: integer
        message:
          type: string
        data:
          nullable: true
          description: Payload; shape depends on the endpoint.
        meta:
          type: object
          additionalProperties: {}
          description: Pagination (count, limit, offset, next, previous) and extras.
      required:
      - data
      - message
      - meta
      - status_code
      - success
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
        status_code:
          type: integer
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: {}
        code:
          type: string
          description: Stable machine-readable error code.
      required:
      - code
      - errors
      - message
      - status_code
      - success
    GoogleLogin:
      type: object
      description: Rejects request bodies that carry fields the serializer does not
        declare.
      properties:
        id_token:
          type: string
          maxLength: 4096
        remember_me:
          type: boolean
          default: false
      required:
      - id_token
    GoogleRedirect:
      type: object
      description: Google's form post after the browser was sent to its sign-in page.
      properties:
        id_token:
          type: string
          maxLength: 4096
        state:
          type: string
          maxLength: 256
      required:
      - id_token
      - state
    GrantReplace:
      type: object
      description: 'PUT: the new full set. One of the two fields is required.'
      properties:
        permissions:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 100
        preset:
