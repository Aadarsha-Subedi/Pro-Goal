    TransferStart:
      type: object
      description: 'Proof of identity for sensitive actions: password, or a fresh
        Google token.'
      properties:
        password:
          type: string
          nullable: true
          maxLength: 128
        id_token:
          type: string
          nullable: true
          maxLength: 4096
        to_user:
          type: string
          format: uuid
      required:
      - to_user
    UploadRequest:
      type: object
      description: '`target` is a task number, or a note or comment id (uuid).'
      properties:
        target_type:
          $ref: '#/components/schemas/TargetTypeEnum'
        target:
          type: string
          maxLength: 64
        filename:
          type: string
          maxLength: 510
        content_type:
          type: string
          maxLength: 127
        size:
          type: integer
          minimum: 1
      required:
      - content_type
      - filename
      - size
      - target
      - target_type
    VerifyEmail:
      type: object
      description: Rejects request bodies that carry fields the serializer does not
        declare.
      properties:
        token:
          type: string
          maxLength: 512
      required:
      - token
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
