<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro-Goal</title>
    <script>
    try {
      var p = JSON.parse(localStorage.getItem("pm-ui-prefs") || "{}");
      var d = p.theme === "dark" || ((!p.theme || p.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
      var e = document.documentElement;
      if (d) e.classList.add("dark");
    } catch (_) {}
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
